name: CI

on:
  push:
    branches: [main]
    paths: ["patcher/**", "tests/**", "ext/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Ad-group logic test (pure Java)
        run: |
          mkdir -p /tmp/adt
          javac -d /tmp/adt ext/mod/AdLogic.java tests/java/mod/AdLogicTest.java
          java -cp /tmp/adt mod.AdLogicTest
