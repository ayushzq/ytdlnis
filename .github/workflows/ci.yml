name: CI

on:
  push:
    branches: [main]
    paths: ["patcher/**", "tests/**", "ext/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Ad-group logic test (pure Java)
        run: |
          mkdir -p /tmp/adt
          javac -d /tmp/adt ext/mod/AdLogic.java ext/mod/RowRules.java tests/java/mod/AdLogicTest.java
          java -cp /tmp/adt mod.AdLogicTest
      - name: Media / URL / ad-signal logic test (needs android.jar from the runner SDK)
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          JAR=""
          for d in $(ls -d "$SDK"/platforms/android-*/ | sort -V -r); do
            if [ -f "${d}android.jar" ]; then JAR="${d}android.jar"; break; fi
          done
          test -n "$JAR" || { echo "no android.jar"; exit 1; }
          mkdir -p /tmp/st
          javac -Xlint:-options -source 8 -target 8 -bootclasspath "$JAR" -d /tmp/st \
            tests/java/com/instagram/feed/media/Media.java tests/java/obf/Obf.java ext/mod/Scan.java tests/java/mod/ScanTest.java
          java -cp "/tmp/st:$JAR" mod.ScanTest
