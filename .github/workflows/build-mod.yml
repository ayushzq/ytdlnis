name: Build Instagram Mod

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Direct download URL of a stock Instagram APK / APKM / XAPK"
        required: false
        type: string
      apk_path:
        description: "Alternative to URL: path of an APK/APKM/XAPK committed to this repo (e.g. input/instagram.apk)"
        required: false
        type: string
      patches:
        description: 'Comma-separated patches or "all" (developer_options, ghost_mode, ghost_story_seen, ghost_dm_seen, ghost_typing, block_ads)'
        required: false
        default: all
        type: string
      allow_null_returns:
        description: "Also neutralise methods that return objects (stronger ghost mode, small crash risk)"
        required: false
        default: false
        type: boolean
      strict:
        description: "Fail the build if a selected patch changed nothing"
        required: false
        default: false
        type: boolean
      mod_menu:
        description: "Add the in-app Mod menu (floating M button: toggles, counters, Developer Options shortcut)"
        required: false
        default: true
        type: boolean
      discover:
        description: "Also list candidate anchor strings (seen / employee / dev options) in the run summary"
        required: false
        default: true
        type: boolean
      create_release:
        description: "Publish the signed APK as a pre-release (leave off: it contains Instagram's code)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: build-mod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run patcher unit tests
        run: python -m unittest discover -s tests -v

      - name: Download build tools
        run: |
          set -euo pipefail
          mkdir -p tools
          gh release download --repo iBotPeaches/Apktool --pattern 'apktool_*.jar' --dir tools
          gh release download --repo patrickfav/uber-apk-signer --pattern 'uber-apk-signer-*.jar' --dir tools
          gh release download --repo REAndroid/APKEditor --pattern 'APKEditor-*.jar' --dir tools
          mv tools/apktool_*.jar tools/apktool.jar
          mv tools/uber-apk-signer-*.jar tools/uber-apk-signer.jar
          mv tools/APKEditor-*.jar tools/APKEditor.jar
          ls -lh tools

      - name: Fetch stock Instagram APK
        env:
          APK_URL: ${{ inputs.apk_url }}
          APK_PATH: ${{ inputs.apk_path }}
        run: |
          set -euo pipefail
          mkdir -p work
          if [ -n "${APK_URL:-}" ]; then
            echo "::add-mask::$APK_URL"
            curl -fL --retry 3 --retry-delay 5 -A "Mozilla/5.0 (Linux; Android 14)" -o work/input.bin "$APK_URL"
          elif [ -n "${APK_PATH:-}" ]; then
            test -f "$APK_PATH" || { echo "::error::File not found: $APK_PATH"; exit 1; }
            cp "$APK_PATH" work/input.bin
          else
            echo "::error::Provide either apk_url or apk_path"; exit 1
          fi
          ls -lh work/input.bin

      - name: Prepare single APK (merge split bundles)
        run: |
          set -euo pipefail
          KIND=$(python -m patcher.apk kind work/input.bin)
          echo "Input type: $KIND"
          case "$KIND" in
            apk)    cp work/input.bin work/stock.apk ;;
            bundle) cp work/input.bin work/input.apkm
                    java -jar tools/APKEditor.jar m -i work/input.apkm -o work/stock.apk ;;
            *)      echo "::error::Input is not an APK/APKM/XAPK file (is the URL a direct download link?)"; exit 1 ;;
          esac
          python -m patcher.apk check work/stock.apk

      - name: Decode with apktool
        run: java -Xmx6g -jar tools/apktool.jar d -f -r -o work/decoded work/stock.apk

      - name: Discover anchors
        if: ${{ inputs.discover }}
        run: |
          mkdir -p work/report
          python -m patcher.discover work/decoded --out work/report/discover.md
          cat work/report/discover.md >> "$GITHUB_STEP_SUMMARY"

      - name: Xref analysis (gates and seen-senders)
        if: ${{ inputs.discover }}
        run: |
          mkdir -p work/report
          python -m patcher.xref work/decoded --out work/report/xref_dev.md --max-classes 12 --per-string 1 \
            --names "com/instagram/(debug|devoptions)|[Ee]mployee|InternalSettings|Dogfood" \
            --strings "Dev Options,com.instagram.debug.devoptions.sandboxselector.SandboxOverlayView,DEVELOPER_OPTIONS,INTERNAL_SETTINGS_BUTTON,is_employee"
          python -m patcher.xref work/decoded --out work/report/xref_ads.md --max-classes 8 --per-string 1 \
            --strings "sponsored_item_meets_min_gap_current_position_less_than_zero maxSeenPosition: ,media_or_ad,ad_id,is_sponsored,sponsored_post,ads_info,injected_ad"
          python -m patcher.xref work/decoded --out work/report/xref_dm.md --max-lines 120 \
            --strings "xig_direct_item_seen,mark_thread_seen-,direct_raven_mark_seen,send_thread_seen_marker"

      - name: Apply patches
        env:
          PATCHES: ${{ inputs.patches }}
          ALLOW_NULL: ${{ inputs.allow_null_returns }}
          STRICT: ${{ inputs.strict }}
          MOD_MENU: ${{ inputs.mod_menu }}
        run: |
          set -euo pipefail
          ARGS=(--patches "${PATCHES:-all}" --report-dir work/report)
          if [ "$MOD_MENU" != "true" ]; then ARGS+=(--no-ext); fi
          if [ "$ALLOW_NULL" = "true" ]; then ARGS+=(--allow-null-returns); fi
          if [ "$STRICT" = "true" ]; then ARGS+=(--strict); fi
          python -m patcher work/decoded "${ARGS[@]}"

      - name: Publish patch report
        if: always()
        run: |
          if [ -f work/report/report.md ]; then cat work/report/report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Rebuild with apktool
        run: java -Xmx6g -jar tools/apktool.jar b work/decoded -o work/unsigned.apk

      - name: Build mod-menu extension dex
        if: ${{ inputs.mod_menu }}
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BT=$(ls -d "$SDK"/build-tools/*/ | sort -V | tail -n1)
          PLAT=""
          for d in $(ls -d "$SDK"/platforms/android-*/ | sort -V -r); do
            if [ -f "${d}android.jar" ]; then PLAT="$d"; break; fi
          done
          test -n "$PLAT" || { echo "::error::No android.jar found in the Android SDK"; exit 1; }
          echo "build-tools: $BT  platform: $PLAT"
          rm -rf work/ext work/extclasses work/extdex
          cp -r ext work/ext
          python -m patcher.mkinfo work/report/report.json work/ext/mod/BuildInfo.java --version "build-${GITHUB_RUN_NUMBER}"
          mkdir -p work/extclasses work/extdex
          javac -Xlint:-options -source 8 -target 8 -bootclasspath "${PLAT}android.jar" -d work/extclasses $(find work/ext -name '*.java')
          "${BT}d8" --release --min-api 28 --lib "${PLAT}android.jar" --output work/extdex $(find work/extclasses -name '*.class')
          ls -l work/extdex

      - name: Restore zip compression (install-critical entries)
        env:
          MOD_MENU: ${{ inputs.mod_menu }}
        run: |
          set -euo pipefail
          EXTRA=()
          if [ "$MOD_MENU" = "true" ]; then EXTRA=(--add-dex work/extdex/classes.dex); fi
          python -m patcher.fixzip "${EXTRA[@]}" work/stock.apk work/unsigned.apk work/fixed.apk

      - name: Align and sign
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_KEY_PASS: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BT=$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/ | sort -V | tail -n1)
          echo "build-tools: $BT"
          # page-align stored .so files (needed when extractNativeLibs=false), then sign without re-aligning
          "${BT}zipalign" -f -P 16 4 work/fixed.apk work/aligned.apk || "${BT}zipalign" -f -p 4 work/fixed.apk work/aligned.apk
          if [ -n "${KS_B64:-}" ]; then
            echo "$KS_B64" | base64 -d > work/release.jks
            java -jar tools/uber-apk-signer.jar -a work/aligned.apk --allowResign --skipZipAlign \
              --ks work/release.jks --ksAlias "$KS_ALIAS" --ksPass "$KS_PASS" \
              --ksKeyPass "${KS_KEY_PASS:-$KS_PASS}" -o work/signed
            rm -f work/release.jks
          else
            java -jar tools/uber-apk-signer.jar -a work/aligned.apk --allowResign --skipZipAlign -o work/signed
          fi
          mkdir -p dist
          cp "$(ls work/signed/*.apk | head -n1)" "dist/Instagram-Mod-${GITHUB_RUN_NUMBER}.apk"
          cp work/report/report.json "dist/patch-report-${GITHUB_RUN_NUMBER}.json" || true
          ls -lh dist

      - name: Verify output APK (install diagnostics)
        if: always()
        run: |
          BT=$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/ | sort -V | tail -n1)
          APK=$(ls dist/Instagram-Mod-*.apk 2>/dev/null | head -n1)
          [ -n "$APK" ] || exit 0
          {
            echo "## Install diagnostics"; echo '```'
            "${BT}apksigner" verify --verbose --print-certs "$APK" 2>&1 | head -n 20 || true
            "${BT}zipalign" -c -P 16 4 "$APK" && echo "zipalign(16K): OK" || echo "zipalign(16K): NOT aligned"
            python -m patcher.fixzip --check work/stock.apk "$APK" || true
            echo "dex files:"; unzip -l "$APK" | awk '{print $4}' | grep -E "^classes[0-9]*\.dex$" | sort -V | tail -n 3
            "${BT}aapt2" dump badging "$APK" 2>/dev/null | grep -E "^(package|sdkVersion|targetSdkVersion|minSdkVersion|native-code|application-label:)" | head -n 12 || true
            "${BT}aapt2" dump xmltree --file AndroidManifest.xml "$APK" 2>/dev/null | grep -iE "extractNativeLibs|isSplitRequired|splits.required|sharedUserId|installLocation" | head -n 8 || true
            echo '```'
          } | tee work/report/install-diagnostics.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload patch report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patch-report-${{ github.run_number }}
          path: work/report/*
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Instagram-Mod-${{ github.run_number }}
          path: dist/*
          retention-days: 14

      - name: Create pre-release
        if: ${{ inputs.create_release }}
        run: |
          gh release create "mod-${GITHUB_RUN_NUMBER}" dist/* \
            --title "Instagram Mod build ${GITHUB_RUN_NUMBER}" \
            --notes "Automated build. See the workflow run's summary for the patch report." \
            --prerelease
